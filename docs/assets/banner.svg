<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="opencode analysis banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c0c0c" />
      <stop offset="1" stop-color="#171a24" />
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b82f6" />
      <stop offset="1" stop-color="#a855f7" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1f2937" stroke-width="1" />
    </pattern>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#3b82f6" stop-opacity="0.25" />
      <stop offset="1" stop-color="#3b82f6" stop-opacity="0" />
    </radialGradient>
  </defs>
  <rect width="1200" height="320" fill="url(#bg)" />
  <rect width="1200" height="320" fill="url(#grid)" opacity="0.6" />
  <ellipse cx="600" cy="160" rx="320" ry="180" fill="url(#glow)" />
  <text x="600" y="135" text-anchor="middle" font-family="JetBrains Mono, ui-monospace, monospace" font-size="62" font-weight="600" fill="#f5f5f5" letter-spacing="-0.02em">
    opencode <tspan fill="url(#accent)">×</tspan> artificial analysis
  </text>
  <text x="600" y="195" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="26" fill="#9ca3af">
    Every Go and free model, compared.
  </text>
  <text x="600" y="245" text-anchor="middle" font-family="JetBrains Mono, ui-monospace, monospace" font-size="13" fill="#6b7280" letter-spacing="0.12em">
    INTELLIGENCE · ALLOWANCE · PRICE · CONTEXT · PRIVACY
  </text>
</svg>
